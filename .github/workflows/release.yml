name: release

# Build the Isohypse FFGL plugins (a source and an effect) for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) "Isohypse.bundle" and "Isohypse Over.bundle",
#                every world in each bundle's Resources/worlds
#   - Windows -> x64 "Isohypse.dll" and "Isohypse Over.dll" (GLEW static via vcpkg),
#                every world an RCDATA resource inside each DLL
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag;
# a workflow_dispatch run builds both platforms and skips publication, which
# is the cheap way to prove Windows still compiles.
#
# Every archive carries ATTRIBUTIONS.md and data/SOURCES.md: some of the
# places' elevation sources (the Terrarium tiles' CC BY and Open Government
# Licence data) require their credit to travel with the plugin.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and never macos-13: the Intel macOS runners are retired,
          # so x86_64 is cross-compiled from Apple Silicon. CMakeLists.txt's
          # CMAKE_OSX_ARCHITECTURES does that on its own.
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tools off: ihtest links against zlib and CGL and is a developer
      # harness, not something that ships. Its checks run locally via
      # tools/verify.sh and in ci.yml.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DISOHYPSE_BUILD_TOOLS=OFF

      # GLEW comes from vcpkg, static-linked (static-md keeps the CRT dynamic
      # so the plugin matches the host) so the .dll has no external
      # glew32.dll runtime dependency.
      #
      # Applocal off: with a static triplet there is no DLL for vcpkg to copy
      # beside the plugins, and its post-build copy step runs once per DLL. The
      # two plugins link in the same instant under --parallel, both copy steps
      # open build/Release together, and one fails with "being used by another
      # process" (exit 32): slipstream's first Windows build, 2026-10-20, on
      # windows-latest's Visual Studio 18 image.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DISOHYPSE_BUILD_TOOLS=OFF
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The shipped DLLs, loaded as a host loads them: see tools/wincheck.ps1.
      - name: Check the DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          ./tools/wincheck.ps1 -Dll "build/Release/Isohypse.dll" -Name "SW Isohypse" -Id IH01 -Kind source -Params 43 -Data data
          if( $LASTEXITCODE ) { exit $LASTEXITCODE }
          ./tools/wincheck.ps1 -Dll "build/Release/Isohypse Over.dll" -Name "SW Isohypse Over" -Id IH02 -Kind effect -Params 46 -Data data
          if( $LASTEXITCODE ) { exit $LASTEXITCODE }

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Two bundles: the source and the Over effect. FFGL resolves one
            # plugMain per binary, so they cannot share one.
            for name in "Isohypse" "Isohypse Over"; do
              cp -R "build/$name.bundle" "out/$name.bundle"
              # Sanity-check each bundle really is universal, exports
              # plugMain and carries its worlds. An arm64-only build logs as a
              # success, and a bundle that exports nothing loads cleanly and
              # reports no plugins.
              bin="out/$name.bundle/Contents/MacOS/$name"
              # Actions runs `shell: bash` as `bash -eo pipefail`, so
              # `cmd | grep -q X` FAILS when grep FINDS its match (the writer
              # takes SIGPIPE). Captured and matched with `case` instead.
              __archs=$( lipo -archs "$bin" )
              case "$__archs" in
                *x86_64*arm64* | *arm64*x86_64*) ;;
                *) echo "$name: expected x86_64 and arm64, got: $__archs"; exit 1 ;;
              esac
              __symbols=$( nm -gU "$bin" )
              case "$__symbols" in
                *_plugMain*) ;;
                *) echo "$name: expected _plugMain"; exit 1 ;;
              esac
              want=$( ls data/*.png | wc -l | tr -d ' ' )
              got=$( ls "out/$name.bundle/Contents/Resources/worlds/"*.png | wc -l | tr -d ' ' )
              [ "$want" = "$got" ] || { echo "$name: $got of $want worlds in Resources/worlds"; exit 1; }
            done
          else
            cp "build/Release/Isohypse.dll" "out/Isohypse.dll"
            cp "build/Release/Isohypse Over.dll" "out/Isohypse Over.dll"
          fi
          cp ATTRIBUTIONS.md out/
          cp data/SOURCES.md out/SOURCES.md
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../isohypse-${{ matrix.name }}.zip" ./*
          else
            zip -r "../isohypse-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, deliberately NOT a .pkg: an FFGL plugin's destination is
        # per-user and edition-specific (~/Documents/Resolume {Arena,Avenue}/
        # Extra Effects), so a .pkg would guess wrong for half of users.
        run: |
          source scripts/release-lib.sh
          rl_init "Isohypse" isohypse "${{ steps.ver.outputs.version }}" \
            com.stoatworks.isohypse "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Isohypse.bundle"
          rl_adhoc_sign "out/Isohypse Over.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isohypse-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip
    # the Windows job uploaded. Its directory page defaults to the common FFGL
    # folder but stays editable, because Resolume reads plugins from a path
    # the user chooses per edition.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Isohypse" isohypse "$version" com.stoatworks.isohypse "$PWD/installers"
          zip="$(find artifacts -name "isohypse-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --plain: a plugin needs neither a shortcut nor a PATH entry (nib#2:
          # an unguarded PATH write once wiped a system PATH).
          rl_nsis windows-x86_64 "$stage" --plain
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: isohypse-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
